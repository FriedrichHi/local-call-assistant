[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-call-assistant"
version = "0.1.0"
description = "Local-first, cross-platform call recording and transcription pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# av 19 removed the open() argument faster-whisper 1.2 passes (metadata_errors).
transcription = ["faster-whisper>=1.2,<2", "av>=11,<19"]
# NVIDIA cuBLAS for GPU transcription on Windows (CTranslate2 bundles cuDNN).
gpu = ["nvidia-cublas-cu12>=12,<13; sys_platform == 'win32'"]

[project.scripts]
lca = "local_call_assistant.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
